     /* ===== CSV PARSER ===== */
     function parseCSV(text){
       const rows = text.trim().split("\n");
       const headers = rows[0].split(",");

       return rows.slice(1).map(row=>{
         const values = row.split(",");
         let obj = {};
         headers.forEach((h,i)=>{
           obj[h.trim()] = values[i] ? values[i].trim() : "";
         });
         return obj;
       });

    async function loadAllTimetables(){

    try{
      const res = await fetch(`data/timetables/table-${i}.csv`);

      if(!res.ok){
        console.log("❌ Missing file:", i);
        continue;
      }

      const text = await res.text();
      const parsed = parseCSV(text);

      allData = allData.concat(parsed);

    }catch(e){
      console.log("❌ Error loading table:", i);
    }

  }

  console.log("✅ Total timetable rows:", allData.length);

  return allData;
}

     function updateStationsByRoute(){
       station.innerHTML =
         '<option value="">Boarding Station / स्टेशन निवडा</option>';

       if(!route.value) return;

       routeStations[route.value].forEach(code=>{
         const opt=document.createElement('option');
         opt.value=code;
     opt.textContent = stations[code][lang];
         station.appendChild(opt);
       });
     }

     function stationExistsInRoute(routeCode, stationCode){
       return (
         routeStations[routeCode] &&
         routeStations[routeCode].includes(stationCode)
       );
     }

     /* ===== FIND BEST ALTERNATIVE SAME PLATFORM TRAIN ===== */
     function findAlternativeTrain(){

       const selRoute = route.value;
       const selStation = station.value;
       const nowMin =
         new Date().getHours()*60 + new Date().getMinutes();

       const selPlatform =
         (platforms[selRoute] || {})[selStation];

       if(!selPlatform) return null;

       const selStops = routeStations[selRoute];
       const selIdx = selStops.indexOf(selStation);
       if(selIdx === -1) return null;

       const selForward = selStops.slice(selIdx + 1);

       let bestAlt = null;

       trains.forEach(t => {

         if(t.route === selRoute) return;
         if(!t.stops[selStation]) return;

         const pf =
           (platforms[t.route] || {})[selStation];
         if(pf !== selPlatform) return;

         const timeMin = toMin(t.stops[selStation]);
         if(timeMin < nowMin) return;

         const altStops = routeStations[t.route];
         const altIdx = altStops.indexOf(selStation);
         if(altIdx === -1) return;

         const altForward = altStops.slice(altIdx + 1);

         const useful = altForward.some(s =>
           selForward.includes(s)
         );

         if(!useful) return;

         if(!bestAlt || timeMin < bestAlt.m){
           bestAlt = {
             route: t.route,
             time: t.stops[selStation],
             m: timeMin
           };
         }

       });

       return bestAlt;
     }
     function setTrainAlarm(trainTime, minutesBefore, el){

       const [hh,mm] = trainTime.split(":").map(Number);

       let alarm = new Date();

       alarm.setHours(hh,mm,0,0);

       const now = new Date();

       if(alarm.getTime() < now.getTime()){
         alarm.setDate(alarm.getDate()+1);
       }

       alarm = new Date(
         alarm.getTime() - minutesBefore*60*1000
       );

       const trigger = alarm.getTime();

       const title = "🚆 Uran Local Train";

       const msg = "Train "+trainTime+" arriving soon";

       if(window.Android && Android.setTrainAlarm){

         Android.setTrainAlarm(trigger,title,msg);

         if(window.Android && Android.showToast){
           Android.showToast("🔔 Alarm set");
         }

         if(el){
           el.style.color="#ff9800";
         }

       }else{

         alert("Android bridge missing");

       }

     }

     /* ===== PROGRESS BAR SIMULATION ===== */

     // 1️⃣ Find full train object
     const fullTrain = trains.find(t =>
       t.no === n.no && t.route === route.value
     );

     if(fullTrain && !isTomorrow){

       const stops = fullTrain.stops;
       const stopCodes = Object.keys(stops);

       // 2️⃣ Start & End time (USER-CENTRIC)
     const routeOrder = routeStations[route.value];
     const userIdx = routeOrder.indexOf(station.value);

     // Safety check
     if(userIdx <= 0) return;

     // journey only till USER station
     const journeyStops = routeOrder.slice(0, userIdx + 1);

     // start = route start, end = USER station
     const startTime = toMin(stops[journeyStops[0]]);
     const endTime   = toMin(stops[journeyStops[journeyStops.length - 1]]);

       // 3️⃣ If train is between START and USER station
     if(nowMin >= startTime && nowMin <= endTime){

         const total = endTime - startTime;
         const elapsed = nowMin - startTime;

         let progress = Math.round((elapsed / total) * 100);
         progress = Math.max(0, Math.min(progress, 100));
     const targetProgress = progress;

     // Initialise animated progress on first load
     if (animatedProgress === 0) {
       animatedProgress = targetProgress - 1; // start just behind
       if (animatedProgress < 0) animatedProgress = 0;
     }

        // 4️⃣ Last crossed station (only till USER station)
     let crossedStation = journeyStops[0];

     journeyStops.forEach(code => {
       if(toMin(stops[code]) <= nowMin){
         crossedStation = code;
       }
     });

         // 5️⃣ Append progress bar HTML

         remainingMin <= 0 && targetProgress >= 100
           ? `${uiText[lang].arrived}: <b>${stations[station.value][lang]}</b>`

     /* ===== SMOOTH CONTINUOUS ANIMATION ===== */

     clearInterval(progressTimer);

     // Smooth forward animation (no reset)
     progressTimer = setInterval(() => {

       if (animatedProgress < targetProgress) {
         animatedProgress += 0.2;
         if (animatedProgress > targetProgress) {
           animatedProgress = targetProgress;
         }
       }

       progressFill.style.width = animatedProgress + '%';

     document.getElementById('progressText').innerText =
       Math.floor(animatedProgress) + '%';

       if (animatedProgress >= targetProgress) {
         clearInterval(progressTimer);
       }

     function setNextTrainAlarmExact(minBefore){

    const lastStop = routeStops[routeStops.length - 1];

    if(station.value === lastStop){
      return false; // ❌ skip destination trains
    }

    return true;
  })
  .map(t => ({

  }))
  .sort((a,b)=>a.m-b.m);

     let [hh, mm] = next.time.split(":").map(Number);

     let alarmDate = new Date();
     alarmDate.setHours(hh, mm, 0, 0);

function loadMumbaiStationData(){

  if(!station.value) return;

  Promise.all([
    fetch("data/train_master.csv").then(r=>r.text())
   ])
  .then(async ([trainCSV]) => {

    trainMaster = parseCSV(trainCSV);
   
    // 🔥 इथे main change
    timetableData = await loadAllTimetables();

    processMumbaiFromCSV();
  });

}
    function isTrainRunningToday(train){

       const today = new Date().getDay();

       if(!train.runs_on || train.runs_on === "Daily"){
         return true;
       }

       if(train.runs_on === "Mon-Sat"){
         return today !== 0;
       }

       return true;
     }

    function processMumbaiFromCSV(){

  const selectedStation = station.value;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();

  let platformMap = {};

  const stationRows = timetableData.filter(
    r => r["Station"] === selectedStation
  );

  if(stationRows.length === 0) return;

  stationRows.forEach(stationRow => {

    Object.keys(stationRow).forEach(trainNo => {

      // ✅ skip headers
      if(trainNo === "Station" || trainNo === "platform") return;

      const time = stationRow[trainNo];
      if(!time || time === "-") return;

      const trainMeta = trainMaster.find(t => t.train_no == trainNo);
      if(!trainMeta) return;
        const platform = stationRow["platform"] || "?";

      // ❌ skip destination
      const selectedStationName = mumbaiStationMap[selectedStation];
      if(trainMeta.destination === selectedStationName) return;

      if(!isTrainRunningToday(trainMeta)) return;

      const [h,m] = time.split(":").map(Number);
      let trainMin = h*60 + m;

      if(trainMin < nowMin){
        trainMin += 1440;
      }

     if(
        !platformMap[platform] ||
        trainMin < platformMap[platform].timeMin
      ){
        platformMap[platform] = {
          trainNo: trainNo,
          route: trainMeta.route,
          destination: trainMeta.destination,
          time: time,
          timeMin: trainMin
        };
      }

    });

  });

  renderMumbaiPlatforms(platformMap);
}

  const now = new Date();

    r => r["Station"] === selectedStation
  );

  if(stationRows.length === 0) return;

  let fullList = [];

  stationRows.forEach(stationRow => {

    Object.keys(stationRow).forEach(trainNo => {

      // ✅ correct header skip
      if(trainNo === "Station" || trainNo === "platform") return;

      const time = stationRow[trainNo];
      if(!time || time === "-") return;

      const trainMeta = trainMaster.find(
        t => t.train_no == trainNo
      );

      if(!trainMeta) return;

      const selectedStationName = mumbaiStationMap[selectedStation];

      // ❌ skip destination
      if(trainMeta.destination === selectedStationName){
        return;
      }

      if(!isTrainRunningToday(trainMeta)) return;

      // ✅ NEW platform logic (CSV मधून)
      const platform = stationRow["platform"] || "?";

      // 🔥 ONLY filter by clicked platform
      if(platform != platformNo) return;

      const [h,m] = time.split(":").map(Number);
      const trainMin = h*60 + m;

      fullList.push({
        trainNo: trainNo,
        time,
        trainMin,
        destination: trainMeta.destination,
        route: trainMeta.route
      });

    });

  });

  // sort
  fullList.sort((a,b)=>a.trainMin - b.trainMin);

  nextTrain.innerHTML = `
    <div style="font-size:16px;font-weight:700;margin-top:2px;padding:4px 0;">
      🚇 Platform ${platformNo} – Full Day Schedule
    </div>
  `;

  list.innerHTML = fullList.map((t,i)=>{

    const isPast = t.trainMin < nowMin;

    const isCurrent =
      i === fullList.findIndex(x => x.trainMin >= nowMin);

    return `
      <div class="rv-item"
        id="${isCurrent ? 'currentTrainItem' : ''}"
        style="${isPast?'opacity:.5':''}"
        onclick="openMumbaiRouteDetail('${t.trainNo}','${t.route}','${platformNo}')">

        behavior:"smooth",
        block:"center"
      });
    }
  },200);

         "></div>` : ``}

         <div style="
           width:45%;
           text-align:right;
           padding-right:15px;
           font-size:14px;
           color:${textColor};
         ">
           ${time}
         </div>

         <div style="
     width:14px;
     height:14px;
     background:${dotColor};
     border-radius:50%;
     border:2px solid #000;
     z-index:2;
     opacity:${timeMin < nowMin ? 0.5 : 1};
     "></div>

         <div style="
           width:45%;
           padding-left:15px;
         ">
           <div style="
             font-size:17px;
             font-weight:600;
             color:${textColor};
           ">
             ${stations[code]?.[lang] || code}
           </div>

           <div style="
             font-size:12px;
             color:#aaa;
             margin-top:3px;
           ">
             PF ${(platforms[routeCode]||{})[code] || ''}
           </div>
         </div>

       </div>
       `;
     }).join('')}

         </div>
       `;

       screen.style.display = 'block';
       history.pushState({page:"routeDetail"}, "");
     }

    function openMumbaiRouteDetail(trainNo, route, platformNo){
        

       const screen = document.getElementById('routeDetailScreen');
       const content = document.getElementById('routeDetailContent');

       const trainMeta = trainMaster.find(t => t.train_no == trainNo);
       if(!trainMeta) return;

       const now = new Date();
       const nowMin = now.getHours()*60 + now.getMinutes();

       // Find all timetable rows where this train appears
       const routeStops = [];

       timetableData.forEach(row => {

         const time = row[trainNo];
         if(!time) return;

         const stationCode = row["Station"];

         routeStops.push({
           code: stationCode,
           time: time,
           timeMin: toMin(time)
         });

       });

       // sort by time
        for(let i = 1; i < routeStops.length; i++){

  if(routeStops[i].timeMin < routeStops[i-1].timeMin){
    routeStops[i].timeMin += 1440;
  }

}
       routeStops.sort((a,b)=>a.timeMin - b.timeMin);

       content.innerHTML = `
       <div style="text-align:center;font-size:18px;margin-bottom:20px">
         Train ${trainNo} → ${trainMeta.destination}
       </div>

       <div style="position:relative;">

         <div style="
       position:absolute;
       left:50%;
       top:18px;
       bottom:18px;
       width:2px;
       background:#bbb;
       transform:translateX(-50%);
     "></div>

         ${routeStops.map((stop,idx)=>{

           const time = to12h(stop.time);

          const isFirst = idx === 0;
     const isLast = idx === routeStops.length - 1;

     let dotColor = "#fff";
     let textColor = "#fff";

     /* FIRST STATION GREEN */
     if(isFirst){
       dotColor = "#00c853";
     }

     /* LAST STATION RED */
     if(isLast){
       dotColor = "#ff1744";
     }

     /* PAST STATION FADE */
     if(stop.timeMin < nowMin){
       dotColor = "#777";
       textColor = "#888";
     }

     /* CURRENT TRAIN POSITION */
     if(Math.abs(stop.timeMin - nowMin) <= 1){
       dotColor = "#00ff00";
       textColor = "#00ff00";
     }
  const row = timetableData.find(r => {
  return (
    r["Station"] === stop.code &&
    r[trainNo] &&
    r[trainNo] !== "-"
  );
});

const pf = row ? (row["platform"] || "?") : "?";
           return `
           <div style="
             display:flex;
             align-items:center;
             justify-content:center;
             margin:18px 0;
             position:relative;
           ">

             <div style="
               width:45%;
               text-align:right;
               padding-right:15px;
               font-size:14px;
               color:${textColor};
             ">
               ${time}
             </div>

             <div style="
       width:14px;
       height:14px;
       background:${dotColor};
       border-radius:50%;
       border:2px solid #000;
       z-index:2;
       opacity:${stop.timeMin < nowMin ? 0.5 : 1};
     "></div>

             <div style="
               width:45%;
               padding-left:15px;
             ">

               <div style="
                 font-size:17px;
                 font-weight:600;
                 color:${textColor};
               ">
                ${mumbaiStationMap[stop.code] || stop.code}
                <div style="
       font-size:12px;
       color:#aaa;
       margin-top:3px;
     ">
       PF ${pf || ''}
     </div>
               </div>

             </div>

           </div>
           `;

         }).join("")}

       </div>
       `;

       screen.style.display='block';
       history.pushState({page:"routeDetail"}, "");
     }
     function closeRouteDetail(){
       document.getElementById('routeDetailScreen').style.display = 'none';
       history.back();
     }
     window.onpopstate = function(event){

       // If route detail open
       const screen = document.getElementById('routeDetailScreen');
       if(screen.style.display === 'block'){
         screen.style.display = 'none';
         return;
       }

       // If full day schedule open
       if(isFullDayView){
         isFullDayView = false;
         loadMumbaiStationData();   // go back to platform overview
         return;
       }

     };

     /* ================= SERVICE WORKER ================= */
     if('serviceWorker'in navigator){
      window.addEventListener('load',()=>{
       navigator.serviceWorker.register('sw.js');
      });
     }

     /* ===== ADS.JSON RUNNING BANNER ===== */

     let adsData = [];
     let currentAdIndex = 0;

     function loadAds(){

     fetch("ads.json")
     .then(res => res.json())
     .then(data => {

     adsData = data.runningText || [];

     loadExtraAds(data);

     rotatingAds = data.rotatingAds || [];

     if(adsData.length){
     showAd();
     }

     if(rotatingAds.length){
     startRotatingAds();
     }

     });

     }

     function showAd(){

     const ad = adsData[currentAdIndex];

    const textEl = document.getElementById("adText");

textEl.innerText = ad.text;

document.getElementById("adLink").href = "tel:" + ad.phone;

document.getElementById("runningAd").style.display = "flex";

/* ===== SPEED CALCULATION ===== */

const screenWidth = window.innerWidth;
const textLength = ad.text.length;

let duration = 20;
duration += textLength / 8;

if(screenWidth < 600){
  duration += 5;
}

/* 🔥 FIX START */
textEl.style.animation = "none";

/* 🔥 position reset */
textEl.style.transform = "translateX(0)";

void textEl.offsetWidth; // force reflow

setTimeout(()=>{
  textEl.style.animation = `tickerScroll ${duration}s linear infinite`;
},10);
/* 🔥 FIX END */
     textEl.style.animation = `tickerScroll ${duration}s linear infinite`;

     /* rotate ad */
     setTimeout(()=>{

     currentAdIndex++;

     if(currentAdIndex >= adsData.length){
     currentAdIndex = 0;
     }

     showAd();

     },duration * 1000);

     }
         document.addEventListener("DOMContentLoaded", loadAds);
         let smallAds=[];

     function loadExtraAds(data){

     smallAds = data.smallAds || [];

  if(smallAds.length){
  showSmallAds();
  autoScrollSmallAds(); // 🔥 ADD THIS
}
     }
     function showSmallAds(){

     const container = document.getElementById("adsSlider");

     container.innerHTML="";

  const shuffled = [...smallAds].sort(()=>Math.random()-0.5); // 🔥 shuffle
const allAds = [...shuffled, ...shuffled]; // duplicate for infinite

allAds.forEach(ad=>{

  container.innerHTML += `
  <a href="${ad.link}" target="_blank">
  <img src="${ad.image}">
  </a>
  `;

});

     document.getElementById("smallAds").style.display="block";

     }

     let rotatingAds = [];
     let rotatingIndex = 0;

     function startRotatingAds(){

     document.getElementById("rotatingAds").style.display="block";

     showRotatingAd();

     setInterval(()=>{

     rotatingIndex++;

     if(rotatingIndex >= rotatingAds.length){
     rotatingIndex = 0;
     }

     showRotatingAd();

     },6000);

     }

     function showRotatingAd(){

     const ad = rotatingAds[rotatingIndex];

     document.getElementById("rotatingAdImg").src = ad.image;

     document.getElementById("rotatingAdLink").href = ad.link;

     document.getElementById("rotatingAdTitle").innerText = ad.title;

     }
    
function autoScrollSmallAds(){

  const slider = document.getElementById("adsSlider");

  let index = 0;

  function scrollAds(){

    const allImages = slider.querySelectorAll("img");

    if(allImages.length === 0) return;

    const total = allImages.length / 2;

    index++;

    allImages[index].scrollIntoView({
      behavior: "smooth",
      inline: "center"
    });

   if(index >= total){

  // 🔥 INSTANT RESET (NO DELAY)
  slider.scrollTo({
    left: 0,
    behavior: "auto"
  });

  index = 0;
}
  }

  // 🔥 start auto scroll
  autoScrollInterval = setInterval(scrollAds, 4000);

  // 🔥 pause on touch
  slider.addEventListener("touchstart", ()=>{
    clearInterval(autoScrollInterval);
  });

  // 🔥 resume on touch end
  slider.addEventListener("touchend", ()=>{
    autoScrollInterval = setInterval(scrollAds, 4000);
  });

}
</script>
