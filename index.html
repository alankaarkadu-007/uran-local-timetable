function parseCSV(text){
  const rows = text.trim().split("\n");
  const headers = rows[0].split(",");

  return rows.slice(1).map(row=>{
    const values = row.split(",");
    let obj = {};
    headers.forEach((h,i)=>{
      obj[h.trim()] = values[i] ? values[i].trim() : "";
    });
    return obj;
  });

function updateStationsByRoute(){
  station.innerHTML =
    '<option value="">Boarding Station / स्टेशन निवडा</option>';

  if(!route.value) return;

  routeStations[route.value].forEach(code=>{
    const opt=document.createElement('option');
    opt.value=code;
opt.textContent = stations[code][lang];
    station.appendChild(opt);
  });
}

function stationExistsInRoute(routeCode, stationCode){
  return (
    routeStations[routeCode] &&
    routeStations[routeCode].includes(stationCode)
  );
}

/* ===== FIND BEST ALTERNATIVE SAME PLATFORM TRAIN ===== */
function findAlternativeTrain(){

  const selRoute = route.value;
  const selStation = station.value;
  const nowMin =
    new Date().getHours()*60 + new Date().getMinutes();

  const selPlatform =
    (platforms[selRoute] || {})[selStation];

  if(!selPlatform) return null;

  const selStops = routeStations[selRoute];
  const selIdx = selStops.indexOf(selStation);
  if(selIdx === -1) return null;

  const selForward = selStops.slice(selIdx + 1);

  let bestAlt = null;

  trains.forEach(t => {

    if(t.route === selRoute) return;
    if(!t.stops[selStation]) return;

    const pf =
      (platforms[t.route] || {})[selStation];
    if(pf !== selPlatform) return;

    const timeMin = toMin(t.stops[selStation]);
    if(timeMin < nowMin) return;

    const altStops = routeStations[t.route];
    const altIdx = altStops.indexOf(selStation);
    if(altIdx === -1) return;

    const altForward = altStops.slice(altIdx + 1);

    const useful = altForward.some(s =>
      selForward.includes(s)
    );

    if(!useful) return;

    if(!bestAlt || timeMin < bestAlt.m){
      bestAlt = {
        route: t.route,
        time: t.stops[selStation],
        m: timeMin
      };
    }

  });

  return bestAlt;
}

  document.getElementById('alarmPopup').style.display = 'none';
}

function setQuickAlarm(min){
  closeAlarmMenu();
  setNextTrainAlarmExact(min);
}

function setCustomAlarm(){
  const min = parseInt(
    document.getElementById('customMin').value
  );

  if(!min || min <= 0){
    alert("Please enter valid minutes");
    return;
  }

  closeAlarmMenu();
  setNextTrainAlarmExact(min);
}

/* ================= RENDER ================= */
function render(){
 if(!route.value || !station.value){
   list.innerHTML='';
   nextTrain.innerHTML='';
   return;
 }
const now = new Date();
 const nowMin = now.getHours()*60 + now.getMinutes();

 const rows = trains
   .filter(t => t.route === route.value && t.stops[station.value])
   .map(t => ({
     no: t.no,
     time: t.stops[station.value],
     m: toMin(t.stops[station.value])
   }))
   .sort((a,b)=>a.m-b.m);
const altTrain = findAlternativeTrain();

 if(rows.length === 0){
   nextTrain.innerHTML='No trains available';
   list.innerHTML='';
   return;
 }

 let nextIdx = rows.findIndex(r => r.m >= nowMin);
 let isTomorrow = false;

 if(nextIdx === -1){
   nextIdx = 0;        // उद्याची पहिली train
   isTomorrow = true;
 }

const isLastTrainToday = (!isTomorrow && nextIdx === rows.length - 1);

setTimeout(()=>{
  const nextEl = document.querySelector('.rv-next');
  if(nextEl){
    nextEl.scrollIntoView({behavior:'smooth',block:'center'});
  }
},200);

const listHeader = `
  <div class="rv-item" style="font-weight:700;background:#f5f5f5;border-bottom:2px solid #ddd">
    <div class="rv-left">
      <div class="rv-time">⏰ Time</div>
    </div>
    <div class="rv-no">🚆 Train No.</div>
  </div>
`;

 /* -------- LIST (FULL TIMETABLE) -------- */
list.innerHTML =
  listHeader +
  rows.map((r,i)=>{
    const isNext = i === nextIdx;
   const showAlt =
  altTrain &&
  i === nextIdx &&
  altTrain.m < r.m;

return `
${showAlt ? `
<div class="rv-item alt-route"
     onclick="applyAltRoute('${altTrain.route}')">
  <div class="rv-left">
    <div class="rv-time">
      ${to12h(altTrain.time)}
      <span class="badge">
        ${getRouteText(altTrain.route)}
      </span>
    </div>
  </div>
</div>
` : ''}

<div class="rv-item ${isNext?'rv-next':''} ${isLastTrainToday && isNext ? 'last-train' : ''}"
     onclick="openRouteDetail(${r.no}, '${route.value}')">
  <div class="rv-left">
    <div class="rv-time">
      ${to12h(r.time)}
      ${isNext ? '<span class="badge">⭐ NEXT</span>' : ''}
    </div>
    <div class="rv-sub">
      ${stations[station.value][lang]} Station
    </div>
  </div>
  <div class="rv-no">
    ${r.no}
  </div>
</div>
`;

  }).join('');

 /* -------- NEXT TRAIN CARD -------- */
 const n = rows[nextIdx];
 const pf = (platforms[route.value]||{})[station.value] || '—';

// Reset animation ONLY when train changes
const trainKey = route.value + '-' + station.value + '-' + n.no;

if (trainKey !== lastTrainKey) {
  animatedProgress = 0;
  lastTrainKey = trainKey;
}

 const remainingMin = isTomorrow
   ? (1440 - nowMin + n.m)
   : (n.m - nowMin);

const timeClass =
  remainingMin <= 3
    ? 'time-blink fast time-alert'
    : remainingMin <= 10
      ? 'time-blink time-alert'
      : '';

nextTrain.innerHTML = `
<div class="next" style="${isLastTrainToday ? 'background:linear-gradient(135deg,#b71c1c,#e53935);border-left:5px solid #ffeb3b;' : ''}">
  🚆 ${uiText[lang].nextTrain} ⭐ <b>${to12h(n.time)}</b>
  ${isTomorrow ? (lang==='mr'?'(उद्या)':'(Tomorrow)') : ''}
</div>

${isLastTrainToday ? `
<div style="margin-top:6px;font-size:14px;font-weight:600;color:#b71c1c">
  ⚠️ ${lang==='mr'
    ? 'आजची ही शेवटची ट्रेन आहे'
    : 'This is the LAST train for today'}
</div>` : ''}

<small style="display:block;margin-top:6px;color:#555;font-size:15px">
⏳ ${uiText[lang].arriving}
   <span class="${timeClass}">
     <b>${formatArrival(remainingMin)}</b>
   </span><br>
  🚉 ${uiText[lang].platform}: ${pf}
</small>
`;
/* ===== PROGRESS BAR SIMULATION ===== */

// 1️⃣ Find full train object
const fullTrain = trains.find(t =>
  t.no === n.no && t.route === route.value
);

if(fullTrain && !isTomorrow){

  const stops = fullTrain.stops;
  const stopCodes = Object.keys(stops);

  // 2️⃣ Start & End time (USER-CENTRIC)
const routeOrder = routeStations[route.value];
const userIdx = routeOrder.indexOf(station.value);

// Safety check
if(userIdx <= 0) return;

// journey only till USER station
const journeyStops = routeOrder.slice(0, userIdx + 1);

// start = route start, end = USER station
const startTime = toMin(stops[journeyStops[0]]);
const endTime   = toMin(stops[journeyStops[journeyStops.length - 1]]);

  // 3️⃣ If train is between START and USER station
if(nowMin >= startTime && nowMin <= endTime){

    const total = endTime - startTime;
    const elapsed = nowMin - startTime;

    let progress = Math.round((elapsed / total) * 100);
    progress = Math.max(0, Math.min(progress, 100));
const targetProgress = progress;

// Initialise animated progress on first load
if (animatedProgress === 0) {
  animatedProgress = targetProgress - 1; // start just behind
  if (animatedProgress < 0) animatedProgress = 0;
}

   // 4️⃣ Last crossed station (only till USER station)
let crossedStation = journeyStops[0];

journeyStops.forEach(code => {
  if(toMin(stops[code]) <= nowMin){
    crossedStation = code;
  }
});

    // 5️⃣ Append progress bar HTML
    nextTrain.innerHTML += `
    <div style="margin-top:10px">
     <div style="font-size:13px;margin-bottom:4px">
  🚦 ${uiText[lang].progress}:
  	<span id="progressText">${Math.floor(animatedProgress)}%</span>
	</div>

      <div style="width:100%;height:8px;background:#e0e0e0;border-radius:6px;overflow:hidden">
       <div id="progressFill" style="
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#4caf50,#81c784);">
</div>
      </div>

<div style="font-size:12px;margin-top:4px;color:#444">
  🚉 ${
    remainingMin <= 0 && targetProgress >= 100
      ? `${uiText[lang].arrived}: <b>${stations[station.value][lang]}</b>`
      : `${uiText[lang].lastCrossed}: <b>${stations[crossedStation]?.[lang] || crossedStation}</b>`
  }
</div>

<div style="font-size:11px;color:#777;margin-top:2px">
  ⓘ ${uiText[lang].estimated}
</div>
    </div>
    `;
/* ===== SMOOTH CONTINUOUS ANIMATION ===== */

clearInterval(progressTimer);

const progressFill = document.getElementById('progressFill');

// Smooth forward animation (no reset)
progressTimer = setInterval(() => {

  if (animatedProgress < targetProgress) {
    animatedProgress += 0.2;
    if (animatedProgress > targetProgress) {
      animatedProgress = targetProgress;
    }
  }

  progressFill.style.width = animatedProgress + '%';

document.getElementById('progressText').innerText =
  Math.floor(animatedProgress) + '%';

  if (animatedProgress >= targetProgress) {
    clearInterval(progressTimer);
  }

}, 1000);

  }
}

function setNextTrainAlarmExact(minBefore){
  // Safety checks
  if (!route.value || !station.value) {
    alert("Please select route and station");
    return;
  }
const customInput = document.getElementById("customMin");

if (customInput) {
  customInput.addEventListener("change", () => {
    const m = parseInt(customInput.value);

    if (isNaN(m) || m <= 0 || m > 60) {
      alert("Please enter minutes between 1 and 60");
      return;
    }

    setNextTrainAlarmExact(m);

    // ✅ User confirmation (UX)
    if (window.Android && Android.showToast) {
      Android.showToast("🔔 Custom alarm set (" + m + " min before)");
    }
  });
}
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();

  const rows = trains
    .filter(t => t.route === route.value && t.stops[station.value])
    .map(t => ({
      no: t.no,
      time: t.stops[station.value],
      m: toMin(t.stops[station.value])
    }))
    .sort((a,b)=>a.m-b.m);

  if (!rows.length) {
    alert("No trains available");
    return;
  }

  let next = rows.find(r => r.m >= nowMin) || rows[0];

  let [hh, mm] = next.time.split(":").map(Number);
  let alarmDate = new Date();
  alarmDate.setHours(hh, mm, 0, 0);

  if (next.m < nowMin) {
    alarmDate.setDate(alarmDate.getDate() + 1);
  }

  alarmDate = new Date(alarmDate.getTime() - minBefore*60*1000);

  const triggerAtMillis = alarmDate.getTime();

  const title = "🚆 Uran Local Train";
  const msg =
    `Next train ${to12h(next.time)} from ${stations[station.value][lang]} ` +
    `(${minBefore} min before)`;

  if (window.Android && Android.setExactTrainAlarm) {
    Android.setExactTrainAlarm(triggerAtMillis, title, msg);
	   if (Android.showToast) {
    Android.showToast(
      "🔔 Alarm set for " +
      to12h(next.time) +
      " (" + minBefore + " min before)"
    );
  }
  } else {
    alert("Android bridge not available");
  }
}

function loadMumbaiStationData(){

  if(!station.value) return;

  // 🔥 Prepare all timetable fetch promises (table-1 to table-14)
  const timetableFiles = [];

for(let i = 1; i <= 60; i++){   // 60 ठेवले future safe साठी
  timetableFiles.push(
    fetch(`data/timetables/table-${i}.csv`)
      .then(r => r.ok ? r.text() : null)
      .catch(()=> null)
  );
}

  Promise.all([
    fetch("data/train_master.csv").then(r=>r.text()),
    fetch("data/platform_master.csv").then(r=>r.text()),
    ...timetableFiles
  ])
  .then(([trainCSV, platformCSV, ...timetableCSVs]) => {

    trainMaster = parseCSV(trainCSV);
    platformMaster = parseCSV(platformCSV);

    // 🔥 Merge ALL timetable files
    timetableData = [];

    timetableCSVs.forEach(csv => {
  if(!csv) return;   // Skip missing files
  const parsed = parseCSV(csv);
  timetableData = timetableData.concat(parsed);
});

// Render station list
renderStationList(mumbaiStationsMaster);
    processMumbaiFromCSV();
  });
}

function isTrainRunningToday(train){

  const today = new Date().getDay();

  if(!train.runs_on || train.runs_on === "Daily"){
    return true;
  }

  if(train.runs_on === "Mon-Sat"){
    return today !== 0;
  }

  return true;
}
	
function processMumbaiFromCSV(){

  const selectedStation = station.value;
  const now = new Date();
  const nowMin = now.getHours()*60 + now.getMinutes();

  let platformMap = {};

  const stationRows = timetableData.filter(
    r => r["Train No."] === selectedStation
  );

  if(stationRows.length === 0) return;

  stationRows.forEach(stationRow => {

    Object.keys(stationRow).forEach(trainNo => {

      if(trainNo === "Train No.") return;

      const time = stationRow[trainNo];
      if(!time) return;

      const trainMeta = trainMaster.find(
        t => t.train_no == trainNo
      );

      if(!trainMeta) return;

      if(!isTrainRunningToday(trainMeta)) return;

      const [h,m] = time.split(":").map(Number);
      let trainMin = h*60 + m;

      if(trainMin < nowMin){
        trainMin += 1440;
      }

     const platformRow = platformMaster.find(
  p => p.route === trainMeta.route &&
       p.station === selectedStation
);

      if(!platformRow) return;

      const platform = platformRow.platform;

      if(
        !platformMap[platform] ||
        trainMin < platformMap[platform].timeMin
      ){
        platformMap[platform] = {
          trainNo: trainNo,
          route: trainMeta.route,
          destination: trainMeta.destination, // 🔥 Direct from master
          time: time,
          timeMin: trainMin
        };
      }

    });

  });

  renderMumbaiPlatforms(platformMap);
}

      const time = stationRow[trainNo];
      if(!time) return;

      const trainMeta = trainMaster.find(
        t => t.train_no == trainNo

      if(!isTrainRunningToday(trainMeta)) return;

      const platformRow = platformMaster.find(

          border-radius:50%;
          border:2px solid #000;
          z-index:2;
        "></div>

        <div style="
          width:45%;
          padding-left:15px;
        ">

          <div style="
            font-size:17px;
            font-weight:600;
            color:${textColor};
          ">
           ${mumbaiStationMap[stop.code] || stop.code}
		   <div style="
  font-size:12px;
  color:#aaa;
  margin-top:3px;
">
  PF ${pf || ''}
</div>
          </div>

        </div>

      </div>
      `;

    }).join("")}

  </div>
  `;

  screen.style.display='block';
  history.pushState({page:"routeDetail"}, "");
}	
function closeRouteDetail(){
  document.getElementById('routeDetailScreen').style.display = 'none';
  history.back();
}
window.onpopstate = function(event){

  // If route detail open
  const screen = document.getElementById('routeDetailScreen');
  if(screen.style.display === 'block'){
    screen.style.display = 'none';
    return;
  }

  // If full day schedule open
  if(isFullDayView){
    isFullDayView = false;
    loadMumbaiStationData();   // go back to platform overview
    return;
  }

};

/* ================= SERVICE WORKER ================= */
if('serviceWorker'in navigator){
 window.addEventListener('load',()=>{
  navigator.serviceWorker.register('sw.js');
 });
}
</script>

<!-- ===== ROUTE DETAIL SCREEN ===== -->
<div id="routeDetailScreen" style="
  display:none;
  position:fixed;
  top:0;left:0;right:0;bottom:0;
  background:#000;
  color:#fff;
  z-index:2000;
  overflow-y:auto;
  padding:20px;
">

  <div style="font-size:18px;font-weight:700;margin-bottom:20px">
    <span onclick="closeRouteDetail()" style="cursor:pointer;color:#00ff00">
      ⬅ Back
    </span>
  </div>

  <div id="routeDetailContent"></div>

</div>

</body>
</html>
